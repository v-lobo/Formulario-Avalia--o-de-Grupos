<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avaliação de equipes · STEM | Colégio Contato</title>
    <meta
      name="description"
      content="Cadastro e avaliação dos integrantes das equipes de STEM do Colégio Contato."
    />
    <link rel="stylesheet" href="/css/form.css" />
    <script src="/js/school-config.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body>
    <main class="form-card">
      <header class="form-header">
        <img
          src="/logocolegiocontato.png"
          alt="Colégio Contato Maceió"
          width="210"
        />
        <h1>Avaliação de equipes</h1>
        <p>STEM · <span id="period">2º semestre · 2026</span></p>
      </header>
      <p id="selection-context" class="selection-context" hidden></p>
      <p id="flow-notice" class="flow-notice" role="status" hidden></p>
      <form id="flow-form" novalidate>
        <section id="screen" class="flow-screen" aria-live="polite"></section>
      </form>
      <p id="busy-status" class="section-description" role="status" hidden></p>
      <p id="form-error" class="error-message" role="alert" hidden></p>
      <footer id="teacher-entry">
        <a
          class="teacher-access"
          href="/dashboard.html"
          aria-label="Área do professor"
          title="Área do professor"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            <path d="M12 14v3" />
          </svg>
        </a>
      </footer>
    </main>
  </body>
</html>
