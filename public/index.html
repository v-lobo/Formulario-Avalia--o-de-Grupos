<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avaliação de equipes · STEM | Colégio Contato</title>
    <meta
      name="description"
      content="Cadastro e avaliação dos integrantes das equipes de STEM do Colégio Contato."
    />
    <link rel="stylesheet" href="/css/form.css" />
    <script src="/js/school-config.js" defer></script>
    <script src="/js/app.js" defer></script>
  </head>
  <body>
    <main class="form-card">
      <header class="form-header">
        <img
          src="/logocolegiocontato.png"
          alt="Colégio Contato Maceió"
          width="210"
        />
        <h1>Avaliação de equipes</h1>
        <p>STEM · <span id="period">2º semestre · 2026</span></p>
      </header>
      <p id="selection-context" class="selection-context" hidden></p>
      <p id="flow-notice" class="flow-notice" role="status" hidden></p>
      <form id="flow-form" novalidate>
        <section id="screen" class="flow-screen" aria-live="polite"></section>
      </form>
      <p id="busy-status" class="section-description" role="status" hidden></p>
      <p id="form-error" class="error-message" role="alert" hidden></p>
      <footer><a href="/dashboard.html">Área do professor</a></footer>
    </main>
  </body>
</html>
